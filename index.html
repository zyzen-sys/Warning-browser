<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continue?</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 20px;
    }

    h1 {
      color: red;
    }

    button {
      display: block;
      margin: 12px auto;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    button[hidden], p[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <h1>VIRUS TO!!</h1>

  <button data-next="sure">Continue</button>
  <button id="sure" data-next="very-sure" hidden>Are you sure?</button>
  <button id="very-sure" data-next="final" hidden>100% sure?!</button>
  <button id="final" data-next="message" hidden>Okay here you go!</button>

  <p id="message" hidden>All done!</p>

  <script>
    document.querySelectorAll("button[data-next]").forEach((button) => {
      button.addEventListener("click", () => {
        document.getElementById(button.dataset.next).hidden = false;
        button.disabled = true;
      });
    });
  </script>
</body>
</html>
